<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>情侶交往紀錄｜事件卡</title>

<!-- Slowly Responsive -->
<link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/responsive.css">

<!-- Slowly Calendar Component -->
<link rel="stylesheet" href="https://lib.stillnessbyslowly.com/component/calendar/calendar_component.css">

<style>
  :root{
    --bg:#f6f0f2;
    --panel:#fff8fa;
    --card:#ffffff;
    --ink:#2b2326;
    --muted:#7a6b72;
    --line:rgba(43,35,38,.12);

    --pink:#d7a6b7;
    --rose:#c98fa7;
    --mauve:#b69aa8;
    --cream:#fbf4f5;
    --shadow:0 14px 28px rgba(40,20,30,.10);
    --radius:18px;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
    background:
      radial-gradient(1200px 700px at 10% -10%,rgba(215,166,183,.25),transparent 60%),
      radial-gradient(900px 600px at 95% 10%,rgba(182,154,168,.18),transparent 55%),
      var(--bg);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }

  .wrap{max-width:1120px;margin:0 auto;padding:18px 18px 44px}

  header{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:flex-end;
    justify-content:space-between;
    margin:6px 0 14px;
  }

  .brand{display:flex;flex-direction:column;gap:4px}
  h1{margin:0;font-size:20px;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:13px}

  .top-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:flex-end;
  }

  button,.btn{
    appearance:none;
    border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel),#fff);
    color:var(--ink);
    padding:10px 12px;
    border-radius:999px;
    box-shadow:0 10px 18px rgba(40,20,30,.08);
    cursor:pointer;
    font-weight:700;
    font-size:13px;
    transition:transform .08s ease,box-shadow .12s ease,border-color .12s ease;
    user-select:none;
  }

  button:hover,.btn:hover{
    transform:translateY(-1px);
    border-color:rgba(201,143,167,.45);
    box-shadow:0 14px 22px rgba(40,20,30,.12);
  }

  button:active,.btn:active{
    transform:translateY(0);
    box-shadow:0 8px 14px rgba(40,20,30,.10)
  }

  .btn-primary{
    border-color:rgba(201,143,167,.55);
    background:linear-gradient(180deg,rgba(215,166,183,.35),rgba(255,248,250,.95));
  }

  .panel{
    background:rgba(255,248,250,.72);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
  }

  /* ===== Calendar consumer ===== */
  .calendar-panel{margin-bottom:12px}

  .calendar-panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:10px;
  }

  .calendar-panel-title{font-weight:900;font-size:14px}
  .calendar-panel-note{color:var(--muted);font-size:12px}

  #coupleCalendar .slowly-calendar{
    --sc-bg:var(--panel);
    --sc-text:var(--ink);
    --sc-muted:var(--muted);
    --sc-soft:var(--cream);
    --sc-weekend:var(--rose);
    --sc-lunar:var(--mauve);
    --sc-festival:var(--rose);
    --sc-solar-term:#8d7f98;
    --sc-grid-line:var(--line);
    --sc-selected-bg:rgba(215,166,183,.18);
    --sc-selected-text:var(--ink);
    --sc-selected-border:rgba(201,143,167,.55);
    --sc-today-ring:var(--rose);
  }

  .grid{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:12px;
  }

  @media(max-width:900px){
    .grid{grid-template-columns:1fr}
  }

  label{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-size:12px;
    color:var(--muted);
    font-weight:700;
  }

  input,select,textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    background:rgba(255,255,255,.9);
    color:var(--ink);
    outline:none;
    font-size:14px;
  }

  textarea{
    min-height:92px;
    resize:vertical;
  }

  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  @media(max-width:560px){
    .row{grid-template-columns:1fr}
  }

  .form-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:flex-start;
    margin-top:10px;
  }

  .divider{
    height:1px;
    background:var(--line);
    margin:12px 0;
  }

  .filters{
    display:grid;
    grid-template-columns:1.3fr .7fr .7fr;
    gap:12px;
    align-items:end;
  }

  @media(max-width:900px){
    .filters{grid-template-columns:1fr}
  }

  .stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
  }

  .pill{
    border:1px solid var(--line);
    background:rgba(255,255,255,.75);
    padding:8px 10px;
    border-radius:999px;
    font-size:12px;
    color:var(--muted);
    font-weight:800;
  }

  .pill b{color:var(--ink)}

  .wall{
    margin-top:14px;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:12px;
  }

  @media(max-width:980px){
    .wall{grid-template-columns:repeat(2,minmax(0,1fr))}
  }

  @media(max-width:560px){
    .wall{grid-template-columns:1fr}
  }

  .card{
    background:rgba(255,255,255,.92);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 12px 22px rgba(40,20,30,.10);
    padding:12px 12px 10px;
    position:relative;
    overflow:hidden;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:0 0 auto 0;
    height:4px;
    background:linear-gradient(90deg,var(--pink),var(--mauve));
    opacity:.9;
  }

  .card-head{
    display:flex;
    gap:10px;
    align-items:flex-start;
    justify-content:space-between;
    margin-top:4px;
  }

  .meta{
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:0;
  }

  .title{
    font-weight:900;
    letter-spacing:.2px;
    line-height:1.25;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .tiny{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    color:var(--muted);
    font-size:12px;
    font-weight:800;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid rgba(201,143,167,.35);
    background:rgba(215,166,183,.18);
    color:rgba(43,35,38,.86);
    font-size:12px;
    font-weight:900;
  }

  .content{
    margin-top:8px;
    font-size:13px;
    color:rgba(43,35,38,.90);
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
  }

  .tags{
    margin-top:10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .tag{
    font-size:12px;
    font-weight:900;
    color:rgba(43,35,38,.75);
    background:rgba(182,154,168,.16);
    border:1px solid rgba(182,154,168,.25);
    padding:6px 10px;
    border-radius:999px;
  }

  .card-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
    align-items:center;
    margin-top:10px;
  }

  .mini{
    padding:8px 10px;
    font-size:12px;
    font-weight:900;
    box-shadow:none;
  }

  .danger{
    border-color:rgba(200,60,90,.28);
    background:linear-gradient(180deg,rgba(200,60,90,.10),rgba(255,248,250,.95));
  }

  .empty{
    margin-top:14px;
    border:1px dashed rgba(43,35,38,.22);
    background:rgba(255,255,255,.55);
    border-radius:var(--radius);
    padding:16px;
    color:var(--muted);
    font-weight:800;
  }

  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(20,10,15,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:50;
  }

  .modal{
    width:min(820px,100%);
    max-height:90dvh;
    overflow:auto;
    background:rgba(255,248,250,.95);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:0 24px 60px rgba(10,5,8,.28);
  }

  .modal-top{
    padding:14px 14px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid var(--line);
  }

  .modal-title{
    font-weight:900;
    letter-spacing:.3px;
  }

  .modal-body{padding:14px}

  .modal-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    padding:0 14px 14px;
    justify-content:flex-end;
  }

  .footer{
    margin-top:14px;
    color:var(--muted);
    font-size:12px;
    text-align:center;
    font-weight:800;
    opacity:.9;
  }

  @media print{
    header,.panel,.footer{display:none!important}
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    .wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .card{box-shadow:none}
  }
</style>
</head>

<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>情侶交往紀錄｜事件卡牆</h1>
      <div class="sub">Stillness by Slowly｜把日子留在這裡。</div>
    </div>

    <div class="top-actions">
      <button class="btn-primary" id="btnOpenAdd">新增事件</button>
      <button id="btnExport">匯出 JSON</button>
      <label class="btn" for="importFile" style="cursor:pointer;">匯入 JSON</label>
      <input id="importFile" type="file" accept="application/json" style="display:none;">
      <button class="danger" id="btnClearAll">清空全部</button>
    </div>
  </header>

  <section class="panel calendar-panel">
    <div class="calendar-panel-head">
      <div class="calendar-panel-title">日曆</div>
      <div class="calendar-panel-note">直接呼叫 Slowly Calendar</div>
    </div>

    <div id="coupleCalendar"></div>
  </section>

  <section class="panel">
    <div class="filters">
      <label>搜尋（標題 / 內容 / 標籤）
        <input id="q" type="search" placeholder="搜尋紀錄">
      </label>

      <label>類型
        <select id="typeFilter">
          <option value="">全部</option>
        </select>
      </label>

      <label>排序
        <select id="sortBy">
          <option value="date_desc">日期：新 → 舊</option>
          <option value="date_asc">日期：舊 → 新</option>
          <option value="updated_desc">更新：新 → 舊</option>
          <option value="title_asc">標題：A → Z</option>
          <option value="title_desc">標題：Z → A</option>
        </select>
      </label>
    </div>

    <div class="stats" id="stats"></div>
    <div class="divider"></div>

    <div class="wall" id="wall"></div>
    <div class="empty" id="empty" style="display:none;">目前沒有事件卡。</div>
  </section>

  <div class="footer">Stillness by Slowly｜Couple Log Cards</div>
</div>

<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-top">
      <div class="modal-title" id="modalTitle">新增事件</div>
      <button class="mini" id="btnCloseModal">關閉</button>
    </div>

    <div class="modal-body">
      <div class="grid">
        <div>
          <div class="row">
            <label>日期
              <input id="fDate" type="date">
            </label>

            <label>類型
              <select id="fType"></select>
            </label>
          </div>

          <div class="row" style="margin-top:10px;">
            <label>標題
              <input id="fTitle" type="text">
            </label>

            <label>心情（可空）
              <input id="fMood" type="text">
            </label>
          </div>

          <label style="margin-top:10px;">內容
            <textarea id="fContent"></textarea>
          </label>
        </div>

        <div>
          <label>標籤（#tag 或逗號分隔）
            <textarea id="fTags"></textarea>
          </label>
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="danger" id="btnDeleteInModal" style="display:none;">刪除</button>
      <button id="btnSave" class="btn-primary">儲存</button>
    </div>
  </div>
</div>

<!-- ===== Slowly Data Core ===== -->
<script src="https://lib.stillnessbyslowly.com/date/datetime.js"></script>
<script src="https://lib.stillnessbyslowly.com/fiction/Fiction_storage.js"></script>
<script src="https://lib.stillnessbyslowly.com/fiction/Fiction_search.js"></script>
<script src="https://lib.stillnessbyslowly.com/fiction/Fiction_filter.js"></script>
<script src="https://lib.stillnessbyslowly.com/fiction/Fiction_sort.js"></script>
<script src="https://lib.stillnessbyslowly.com/data/Data_backup.js"></script>

<!-- ===== Calendar Core ===== -->
<script src="https://lib.stillnessbyslowly.com/calendar/lunar_data.js"></script>
<script src="https://lib.stillnessbyslowly.com/calendar/lunar.js"></script>
<script src="https://lib.stillnessbyslowly.com/calendar/lunar_festivals_data.js"></script>
<script src="https://lib.stillnessbyslowly.com/calendar/lunar_festivals.js"></script>
<script src="https://lib.stillnessbyslowly.com/calendar/solar_festivals_data.js"></script>
<script src="https://lib.stillnessbyslowly.com/calendar/solar_festivals.js"></script>
<script src="https://lib.stillnessbyslowly.com/calendar/solar_terms_data.js"></script>
<script src="https://lib.stillnessbyslowly.com/calendar/solar_terms.js"></script>
<script src="https://lib.stillnessbyslowly.com/calendar/calendar.js"></script>

<!-- ===== Calendar Component ===== -->
<script src="https://lib.stillnessbyslowly.com/component/calendar/calendar_component.js"></script>

<script>
(async () => {
  "use strict";

  SlowlyCalendar.mount("#coupleCalendar", {
    view: "month",
    gridLines: false
  });

  const SETTINGS_KEY = "sbs_couple_log_settings_v1";

  const recordStore = FictionStorage
    .create({ namespace: "sbs-couple-log" })
    .collection("records", {
      normalize: normalizeRecord
    });

  const DEFAULT_TYPES = [
    "日常照顧",
    "節日/儀式感",
    "旅行/約會",
    "吵架/摩擦",
    "和好/溫柔",
    "禮物/花錢",
    "荒謬事件",
    "里程碑",
    "其他"
  ];

  const wall = document.getElementById("wall");
  const empty = document.getElementById("empty");
  const statsEl = document.getElementById("stats");

  const q = document.getElementById("q");
  const typeFilter = document.getElementById("typeFilter");
  const sortBy = document.getElementById("sortBy");

  const btnExport = document.getElementById("btnExport");
  const importFile = document.getElementById("importFile");
  const btnClearAll = document.getElementById("btnClearAll");

  const btnOpenAdd = document.getElementById("btnOpenAdd");
  const modalBackdrop = document.getElementById("modalBackdrop");
  const btnCloseModal = document.getElementById("btnCloseModal");
  const modalTitle = document.getElementById("modalTitle");
  const btnSave = document.getElementById("btnSave");
  const btnDeleteInModal = document.getElementById("btnDeleteInModal");

  const fDate = document.getElementById("fDate");
  const fType = document.getElementById("fType");
  const fTitle = document.getElementById("fTitle");
  const fMood = document.getElementById("fMood");
  const fContent = document.getElementById("fContent");
  const fTags = document.getElementById("fTags");

  let records = await recordStore.all();
  let settings = loadSettings();
  let editingId = null;

  init();

  function init(){
    q.value = settings.q;
    sortBy.value = settings.sort;

    refreshTypes();

    if([...typeFilter.options].some(option => option.value === settings.type)){
      typeFilter.value = settings.type;
    }

    q.addEventListener("input", () => {
      settings.q = q.value;
      saveSettings();
      render();
    });

    typeFilter.addEventListener("change", () => {
      settings.type = typeFilter.value;
      saveSettings();
      render();
    });

    sortBy.addEventListener("change", () => {
      settings.sort = sortBy.value;
      saveSettings();
      render();
    });

    btnOpenAdd.addEventListener("click", openAdd);
    btnCloseModal.addEventListener("click", closeModal);

    modalBackdrop.addEventListener("click", event => {
      if(event.target === modalBackdrop){
        closeModal();
      }
    });

    btnSave.addEventListener("click", onSave);
    btnDeleteInModal.addEventListener("click", onDeleteFromModal);

    btnExport.addEventListener("click", exportJSON);
    importFile.addEventListener("change", onImportFile);

    btnClearAll.addEventListener("click", async () => {
      if(!confirm("確定要清空全部資料？這是不可逆操作。")){
        return;
      }

      await recordStore.clear();
      records = [];
      render();
    });

    window.addEventListener("keydown", event => {
      if(event.key === "Escape" && isModalOpen()){
        closeModal();
      }
    });

    render();
  }

  function getTypes(){
    const types = new Set(DEFAULT_TYPES);

    records.forEach(record => {
      if(record.type){
        types.add(record.type);
      }
    });

    return [...types];
  }

  function refreshTypes(){
    const types = getTypes();
    const currentFilter = typeFilter.value;

    typeFilter.innerHTML =
      `<option value="">全部</option>` +
      types
        .map(type =>
          `<option value="${escapeHtmlAttr(type)}">${escapeHtml(type)}</option>`
        )
        .join("");

    fType.innerHTML = types
      .map(type =>
        `<option value="${escapeHtmlAttr(type)}">${escapeHtml(type)}</option>`
      )
      .join("");

    if(currentFilter === "" || types.includes(currentFilter)){
      typeFilter.value = currentFilter;
    }
  }

  function render(){
    refreshTypes();

    const list = getFilteredSortedRecords();

    renderStats(list);
    renderWall(list);
  }

  function getFilteredSortedRecords(){
    let list = FictionFilter.filter(records, {
      equals: {
        type: typeFilter.value
      }
    });

    list = FictionSearch.search(
      list,
      q.value,
      ["title", "content", "mood", "tags", "type", "date"]
    );

    const sorts = {
      date_desc: {
        field: "date",
        direction: "desc",
        type: "string"
      },
      date_asc: {
        field: "date",
        direction: "asc",
        type: "string"
      },
      updated_desc: {
        field: "updatedAt",
        direction: "desc",
        type: "date"
      },
      title_asc: {
        field: "title",
        direction: "asc",
        type: "string"
      },
      title_desc: {
        field: "title",
        direction: "desc",
        type: "string"
      }
    };

    return FictionSort.sort(
      list,
      sorts[sortBy.value] || sorts.date_desc
    );
  }

  function renderStats(currentList){
    const byType = {};

    records.forEach(record => {
      const type = record.type || "未分類";
      byType[type] = (byType[type] || 0) + 1;
    });

    const topTypes = Object.entries(byType)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3);

    const absurdCount = records.filter(
      record => record.type === "荒謬事件"
    ).length;

    statsEl.innerHTML = `
      <div class="pill">
        總事件 <b>${records.length}</b>｜目前顯示 <b>${currentList.length}</b>
      </div>

      <div class="pill">
        荒謬事件 <b>${absurdCount}</b>
      </div>

      ${topTypes.map(([type, count]) =>
        `<div class="pill"><b>${escapeHtml(type)}</b> × <b>${count}</b></div>`
      ).join("")}
    `;
  }

  function renderWall(list){
    wall.innerHTML = "";
    empty.style.display = list.length ? "none" : "block";

    list.forEach(record => {
      const dateText = record.date
        ? DateTime.formatDate(record.date)
        : "（無日期）";

      const tags = record.tags.length
        ? `
          <div class="tags">
            ${record.tags.map(tag =>
              `<span class="tag">#${escapeHtml(tag)}</span>`
            ).join("")}
          </div>
        `
        : "";

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="card-head">
          <div class="meta">
            <div class="title">${escapeHtml(record.title || "（未命名）")}</div>
            <div class="tiny"><span>${escapeHtml(dateText)}</span></div>
          </div>

          <div>
            <span class="badge">
              ${escapeHtml(record.type || "未分類")}
              ${record.mood ? ` · ${escapeHtml(record.mood)}` : ""}
            </span>
          </div>
        </div>

        ${
          record.content
            ? `<div class="content">${escapeHtml(record.content)}</div>`
            : `<div class="content" style="color:var(--muted)">（無內容）</div>`
        }

        ${tags}

        <div class="card-actions">
          <button class="mini" data-act="edit" data-id="${escapeHtmlAttr(record.id)}">
            編輯
          </button>

          <button class="mini danger" data-act="del" data-id="${escapeHtmlAttr(record.id)}">
            刪除
          </button>
        </div>
      `;

      card.addEventListener("click", event => {
        const button = event.target.closest("button");

        if(!button){
          return;
        }

        if(button.dataset.act === "edit"){
          openEdit(button.dataset.id);
        }

        if(button.dataset.act === "del"){
          deleteRecord(button.dataset.id);
        }
      });

      wall.appendChild(card);
    });
  }

  function openAdd(){
    editingId = null;

    modalTitle.textContent = "新增事件";
    btnDeleteInModal.style.display = "none";

    fDate.value = DateTime.dateKey();
    fType.value = "日常照顧";
    fTitle.value = "";
    fMood.value = "";
    fContent.value = "";
    fTags.value = "";

    openModal();
  }

  function openEdit(id){
    const record = records.find(
      item => String(item.id) === String(id)
    );

    if(!record){
      return;
    }

    editingId = record.id;

    modalTitle.textContent = "編輯事件";
    btnDeleteInModal.style.display = "inline-flex";

    fDate.value = record.date;
    fType.value = record.type;
    fTitle.value = record.title;
    fMood.value = record.mood;
    fContent.value = record.content;
    fTags.value = record.tags.map(tag => `#${tag}`).join(" ");

    openModal();
  }

  function openModal(){
    modalBackdrop.style.display = "flex";
    modalBackdrop.setAttribute("aria-hidden", "false");
  }

  function closeModal(){
    modalBackdrop.style.display = "none";
    modalBackdrop.setAttribute("aria-hidden", "true");
    editingId = null;
  }

  function isModalOpen(){
    return modalBackdrop.style.display === "flex";
  }

  async function onSave(){
    const data = {
      date: fDate.value,
      type: fType.value || "其他",
      title: fTitle.value.trim(),
      mood: fMood.value.trim(),
      content: fContent.value.trim(),
      tags: parseTags(fTags.value)
    };

    if(!data.title){
      alert("請先填標題。");
      fTitle.focus();
      return;
    }

    try{
      if(editingId){
        await recordStore.update(editingId, data);
      }else{
        await recordStore.add(data);
      }

      records = await recordStore.all();

      closeModal();
      render();
    }catch(error){
      console.error(error);
      alert("儲存失敗：" + (error?.message || String(error)));
    }
  }

  async function onDeleteFromModal(){
    if(editingId){
      await deleteRecord(editingId, true);
    }
  }

  async function deleteRecord(id, closeAfter = false){
    const record = records.find(
      item => String(item.id) === String(id)
    );

    if(!record){
      return;
    }

    if(!confirm(`確定刪除「${record.title}」？`)){
      return;
    }

    try{
      await recordStore.remove(id);
      records = await recordStore.all();

      if(closeAfter){
        closeModal();
      }

      render();
    }catch(error){
      console.error(error);
      alert("刪除失敗：" + (error?.message || String(error)));
    }
  }

  function exportJSON(){
    DataBackup.downloadJson(
      `couple_log_backup_${DataBackup.todayISO().replaceAll("-", "")}.json`,
      DataBackup.createPayload({
        app: "sbs_couple_log_cards",
        version: 1,
        data: records
      })
    );
  }

  async function onImportFile(){
    const file = importFile.files?.[0];

    if(!file){
      return;
    }

    try{
      const json = await DataBackup.readJsonFile(file);
      const incoming = DataBackup.extractData(json);

      if(!Array.isArray(incoming)){
        throw new Error("備份資料必須是陣列。");
      }

      const imported = incoming
        .filter(record =>
          record &&
          typeof record === "object" &&
          String(record.title || "").trim()
        )
        .map(normalizeRecord);

      const mode = prompt("匯入模式：1 合併 / 2 覆蓋", "1");

      if(mode !== "1" && mode !== "2"){
        return;
      }

      let nextRecords = imported;

      if(mode === "1"){
        const map = new Map(
          records.map(record => [String(record.id), record])
        );

        imported.forEach(record => {
          const old = map.get(String(record.id));

          if(
            !old ||
            new Date(record.updatedAt || 0) >= new Date(old.updatedAt || 0)
          ){
            map.set(String(record.id), record);
          }
        });

        nextRecords = [...map.values()];
      }

      await recordStore.replace(nextRecords);
      records = await recordStore.all();

      render();
    }catch(error){
      console.error(error);
      alert("匯入失敗：" + (error?.message || String(error)));
    }finally{
      importFile.value = "";
    }
  }

  function normalizeRecord(record){
    return {
      ...record,
      date: DateTime.parseDateKey(String(record.date || "").slice(0, 10))
        ? String(record.date).slice(0, 10)
        : "",
      type: String(record.type || "其他").trim() || "其他",
      title: String(record.title || "").trim(),
      mood: String(record.mood || "").trim(),
      content: String(record.content || "").trim(),
      tags: Array.isArray(record.tags)
        ? record.tags
            .map(tag => String(tag).trim())
            .filter(Boolean)
        : []
    };
  }

  function loadSettings(){
    try{
      const saved = JSON.parse(
        localStorage.getItem(SETTINGS_KEY) || "{}"
      );

      return {
        q: String(saved.q || ""),
        type: String(saved.type || ""),
        sort: String(saved.sort || "date_desc")
      };
    }catch(_){
      return {
        q: "",
        type: "",
        sort: "date_desc"
      };
    }
  }

  function saveSettings(){
    localStorage.setItem(
      SETTINGS_KEY,
      JSON.stringify(settings)
    );
  }

  function parseTags(value){
    return [...new Set(
      String(value || "")
        .replace(/，/g, ",")
        .split(/[\s,]+/)
        .map(tag => tag.trim().replace(/^#/, ""))
        .filter(Boolean)
    )];
  }

  function escapeHtml(value){
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function escapeHtmlAttr(value){
    return escapeHtml(value);
  }
})();
</script>
</body>
</html>
