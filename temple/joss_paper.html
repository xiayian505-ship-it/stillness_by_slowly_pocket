<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>電子燒紙錢｜test</title>
<style>
:root{
  --bg:#0f1115;
  --card:#141821;
  --text:#e9eef5;
  --muted:#9aa3b2;
  --ring:rgba(255,255,255,.08);
  --shadow:0 18px 50px rgba(0,0,0,.45);

  --paper:#f2c94c;
  --paper2:#d9a800;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:
    radial-gradient(1100px 650px at 25% 10%, rgba(255,255,255,.06), transparent 60%),
    linear-gradient(180deg,#0c0e12,var(--bg));
  color:var(--text);
  font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
}

.card{
  width:min(520px,92vw);
  background:var(--card);
  border:1px solid var(--ring);
  border-radius:24px;
  box-shadow:var(--shadow);
  padding:22px;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
h1{margin:0 0 6px;font-size:18px}
.sub{font-size:13px;color:var(--muted);line-height:1.6}

.stat{text-align:right}
.stat .num{font-size:32px;font-weight:800}
.stat .label{font-size:12px;color:var(--muted)}

.scene{
  position:relative;
  height:320px;
  border-radius:18px;
  border:1px solid var(--ring);
  background:rgba(255,255,255,.02);
  overflow:hidden;
  display:grid;
  place-items:center;
}

.brazier{
  position:absolute;
  bottom:34px;
  width:220px;
  height:56px;
  border-radius:999px;
  background:rgba(0,0,0,.35);
}

.stack{
  position:relative;
  width:220px;
  height:220px;
  margin-bottom:60px;
}

/* 紙錢 */
.paper{
  position:absolute;
  left:50%;
  top:50%;
  width:120px;
  height:120px;
  border-radius:10px;
  background:linear-gradient(145deg,var(--paper),var(--paper2));
  border:1px solid rgba(0,0,0,.15);
  box-shadow:0 18px 36px rgba(0,0,0,.35);
  cursor:pointer;
  user-select:none;
  display:grid;
  place-items:center;
  transform:
    translate(-50%,-50%)
    translate(var(--x),var(--y))
    rotate(var(--r))
    scale(var(--s));
  transition:transform .15s ease, filter .25s linear, opacity .25s linear;
}

.paper:hover{
  transform:
    translate(-50%,-50%)
    translate(var(--x),var(--y))
    rotate(var(--r))
    scale(calc(var(--s) * 1.03));
}

.paper .frame{
  width:70%;
  height:70%;
  border-radius:10px;
  border:2px solid rgba(0,0,0,.25);
  display:grid;
  place-items:center;
}
.paper .seal{
  width:18px;
  height:18px;
  background:rgba(0,0,0,.25);
  border-radius:4px;
}

/* 燒 */
.paper.burning{
  animation:burn 1.25s ease-in forwards;
  cursor:default;
}
@keyframes burn{
  0%{opacity:1}
  60%{filter:grayscale(.6) brightness(.7)}
  100%{opacity:0; transform:
    translate(-50%,-50%)
    translate(var(--x),var(--y))
    rotate(var(--r))
    scale(calc(var(--s) * .6))}
}

.controls{
  margin-top:14px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
}
button{
  border:1px solid var(--ring);
  background:rgba(255,255,255,.03);
  color:var(--text);
  padding:10px 14px;
  border-radius:14px;
  cursor:pointer;
  font-weight:650;
}
button:hover{background:rgba(255,255,255,.05)}
.hint{font-size:12px;color:var(--muted)}
</style>
</head>

<body>
<div class="card">
  <div class="top">
    <div>
      <h1>電子燒紙錢</h1>
      <p class="sub">點一張紙錢，讓它好好燒完。</p>
    </div>
    <div class="stat">
      <div class="num" id="count">0</div>
      <div class="label">已燒張數</div>
    </div>
  </div>

  <div class="scene">
    <div class="stack" id="stack"></div>
    <div class="brazier"></div>
  </div>

  <div class="controls">
    <div>
      <button id="refill">補紙錢（+6）</button>
      <button id="clear">清場</button>
    </div>
    <div class="hint">提示：亂一點，才是真的</div>
  </div>
</div>

<script>
(() => {
  const stack = document.getElementById("stack");
  const countEl = document.getElementById("count");
  const refill = document.getElementById("refill");
  const clear = document.getElementById("clear");

  let burned = 0;

  const rand = (min,max)=>Math.random()*(max-min)+min;

  function makePaper(){
    const el = document.createElement("div");
    el.className = "paper";

    el.style.setProperty("--r", rand(-25,25)+"deg");
    el.style.setProperty("--x", rand(-60,60)+"px");
    el.style.setProperty("--y", rand(-45,45)+"px");
    el.style.setProperty("--s", rand(0.9,1.08));
    el.style.zIndex = Math.floor(rand(1,100));

    el.innerHTML = `<div class="frame"><div class="seal"></div></div>`;

    el.onclick = () => {
      if(el.classList.contains("burning")) return;
      el.classList.add("burning");
      burned++;
      countEl.textContent = burned;
      setTimeout(()=>el.remove(),1250);
    };

    return el;
  }

  function add(n){
    for(let i=0;i<n;i++){
      stack.appendChild(makePaper());
    }
  }

  refill.onclick = ()=>add(6);
  clear.onclick = ()=>{
    stack.innerHTML="";
    burned=0;
    countEl.textContent=burned;
    add(6);
  };

  add(6);
})();
</script>
</body>
</html>
