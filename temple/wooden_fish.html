<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>功德木魚｜test</title>
<style>
:root{
  --bg:#0f1115;
  --card:#141821;
  --text:#e9eef5;
  --muted:#aab3c0;
  --ring:rgba(255,255,255,.08);
  --shadow: 0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:
    radial-gradient(1200px 700px at 20% 10%, rgba(255,255,255,.06), transparent 60%),
    radial-gradient(900px 500px at 80% 20%, rgba(255,255,255,.05), transparent 55%),
    linear-gradient(180deg, #0c0e12, var(--bg));
  color:var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", sans-serif;
}
.wrap{ width:min(560px,92vw); padding:22px; }
.card{
  background: linear-gradient(180deg, rgba(255,255,255,.03), transparent 38%), var(--card);
  border:1px solid var(--ring);
  border-radius:24px;
  box-shadow:var(--shadow);
  padding:22px;
}
.top{
  display:flex;
  justify-content:space-between;
  gap:14px;
  margin-bottom:18px;
}
h1{ font-size:18px; margin:0 0 6px; }
.sub{ font-size:13px; color:var(--muted); line-height:1.6; margin:0; }
.count{text-align:right;min-width:140px;}
.count .num{font-size:34px;font-weight:760;}
.count .label{font-size:12px;color:var(--muted);margin-top:6px;}

.center{display:grid;place-items:center;padding:12px 0;}
.muyu{
  width:min(300px,68vw);
  aspect-ratio:1/1;
  border-radius:50%;
  border:1px solid var(--ring);
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,.10), transparent 52%),
    radial-gradient(circle at 50% 55%, rgba(0,0,0,.35), transparent 62%),
    linear-gradient(145deg, rgba(255,255,255,.05), rgba(0,0,0,.18));
  box-shadow:0 18px 60px rgba(0,0,0,.55), inset 0 0 0 6px rgba(255,255,255,.02);
  display:grid;place-items:center;
  cursor:pointer;user-select:none;
  transition:transform .08s ease;
  position:relative;
}
.muyu:active{transform:scale(.985)}
.muyu .inner{
  width:72%;height:72%;border-radius:50%;
  border:1px solid rgba(255,255,255,.08);
  display:grid;place-items:center;
}
.float{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  font-weight:800;
  opacity:0;
}
.float.show{animation:pop .52s ease-out forwards}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.9)}
  15%{opacity:1;transform:translate(-50%,-58%)}
  100%{opacity:0;transform:translate(-50%,-88%)}
}
.bottom{
  display:flex;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-top:16px;
}
.btns,.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select,input[type=range]{
  border:1px solid var(--ring);
  background:rgba(255,255,255,.03);
  color:var(--text);
  padding:8px 12px;
  border-radius:12px;
}
button{cursor:pointer}
.hint{font-size:12px;color:var(--muted)}
label{font-size:12px;color:var(--muted)}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <div>
          <h1>功德木魚（沒意義但療癒）</h1>
          <p class="sub">點一下，功德 +1。<br>今天不需要 KPI，你只需要叩一聲。</p>
        </div>
      <div class="count">
        <div class="num" id="count">0</div>
        <div class="label">功德值</div>
      </div>
    </div>

    <div class="center">
      <div class="muyu" id="muyu" tabindex="0">
        <div class="inner">叩</div>
        <div class="float" id="float">功德 +1</div>
      </div>
    </div>

    <div class="bottom">
      <div class="btns">
        <button id="reset">歸零</button>
        <button id="mute">音效：開</button>
      </div>
      <div class="controls">
        <label>音量</label>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7">
        <select id="sound">
          <option value="classic">經典木魚</option>
          <option value="deep">低沉厚木</option>
          <option value="light">清脆短敲</option>
          <option value="bell">冥想低鐘</option>
        </select>
      </div>
    </div>

    <div class="hint">快捷鍵：空白鍵 / Enter</div>
  </div>
</div>

<script>
(() => {
  const $count = document.getElementById("count");
  const $muyu  = document.getElementById("muyu");
  const $float = document.getElementById("float");
  const $reset = document.getElementById("reset");
  const $mute  = document.getElementById("mute");
  const $vol   = document.getElementById("volume");
  const $sound = document.getElementById("sound");

  let merit = 0;
  let muted = false;
  let ctx = null;

  function audio(){
    if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==="suspended") ctx.resume();
    return ctx;
  }

  /* ===== 各音效實作 ===== */

  function soundClassic(t, vol){
    const c = audio();

    const osc1 = c.createOscillator();
    const gain1 = c.createGain();
    osc1.type = "sine";
    osc1.frequency.setValueAtTime(220, t);
    osc1.frequency.exponentialRampToValueAtTime(120, t + 0.05);
    gain1.gain.setValueAtTime(0.0001, t);
    gain1.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    gain1.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);

    const osc2 = c.createOscillator();
    const gain2 = c.createGain();
    osc2.type = "triangle";
    osc2.frequency.setValueAtTime(680, t);
    osc2.frequency.exponentialRampToValueAtTime(420, t + 0.06);
    gain2.gain.setValueAtTime(0.0001, t);
    gain2.gain.exponentialRampToValueAtTime(vol * 0.33, t + 0.006);
    gain2.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);

    const lp = c.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(1400, t);

    osc1.connect(gain1).connect(lp);
    osc2.connect(gain2).connect(lp);
    lp.connect(c.destination);

    osc1.start(t); osc1.stop(t + 0.13);
    osc2.start(t); osc2.stop(t + 0.11);
  }

  function soundDeep(t, vol){
    const c = audio();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(70, t + 0.07);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    osc.connect(gain).connect(c.destination);
    osc.start(t); osc.stop(t + 0.2);
  }

  function soundLight(t, vol){
    const c = audio();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(880, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol * 0.6, t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    osc.connect(gain).connect(c.destination);
    osc.start(t); osc.stop(t + 0.06);
  }

  function soundBell(t, vol){
    const c = audio();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(260, t + 0.4);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol * 0.5, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    osc.connect(gain).connect(c.destination);
    osc.start(t); osc.stop(t + 0.65);
  }

  function knock(){
    if(muted) return;
    const t = audio().currentTime;
    const vol = parseFloat($vol.value);
    switch($sound.value){
      case "deep": soundDeep(t, vol); break;
      case "light": soundLight(t, vol); break;
      case "bell": soundBell(t, vol); break;
      default: soundClassic(t, vol);
    }
  }

  function hit(){
    merit++;
    $count.textContent = merit;
    $float.classList.remove("show");
    void $float.offsetWidth;
    $float.classList.add("show");
    knock();
  }

  $muyu.onclick = hit;
  $muyu.onkeydown = e=>{
    if(e.key===" "||e.key==="Enter"){e.preventDefault();hit();}
  };
  window.onkeydown = e=>{
    if(e.key===" "||e.key==="Enter"){e.preventDefault();hit();}
  };

  $reset.onclick = ()=>{merit=0;$count.textContent=0};
  $mute.onclick = ()=>{
    muted=!muted;
    $mute.textContent = muted?"音效：關":"音效：開";
  };
})();
</script>
</body>
</html>
