<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>即時路況 test</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  background:#f5f5f3;
  color:#2a2a2a;
}

h1{
  font-size:18px;
  text-align:center;
  margin:16px 0;
}

.wrap{
  display:flex;
  gap:12px;
  padding:12px;
}

.column{
  flex:1;
  background:#fff;
  border-radius:12px;
  padding:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.06);
}

.column h2{
  font-size:16px;
  margin:0 0 8px;
  border-bottom:1px solid #eee;
  padding-bottom:4px;
}

.section{
  margin-bottom:12px;
}

.section h3{
  font-size:14px;
  margin:8px 0 4px;
  color:#555;
}

.point{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed #eee;
  font-size:14px;
}

.speed{
  font-weight:600;
}

.fast{ color:#2e7d32; }
.mid{ color:#f9a825; }
.slow{ color:#c62828; }

.footer{
  text-align:center;
  font-size:12px;
  color:#777;
  padding:12px;
}
</style>
</head>

<body>

<h1>即時路況（test）</h1>

<div class="wrap">
  <div class="column" id="col1">
    <h2>國道 1 號</h2>
  </div>

  <div class="column" id="col3">
    <h2>國道 3 號</h2>
  </div>
</div>

<div class="footer">資料來源：Cloudflare Worker（mock）</div>

<script>
const API = "https://black-tooth-66c3.xiayian505.workers.dev/";

function speedClass(speed){
  if(speed >= 80) return "fast";
  if(speed >= 60) return "mid";
  return "slow";
}

fetch(API)
  .then(res => res.json())
  .then(data => {
    data.highways.forEach(h => {

      const col = h.road.includes("1") 
        ? document.getElementById("col1")
        : document.getElementById("col3");

      const sec = document.createElement("div");
      sec.className = "section";

      const title = document.createElement("h3");
      title.textContent = 
        (h.direction === "northbound" ? "北上" : "南下") +
        "｜" + h.section;
      sec.appendChild(title);

      h.points.forEach(p => {
        const row = document.createElement("div");
        row.className = "point";

        const name = document.createElement("span");
        name.textContent = p.interchange;

        const speed = document.createElement("span");
        speed.className = "speed " + speedClass(p.speed);
        speed.textContent = p.speed + " km/h";

        row.appendChild(name);
        row.appendChild(speed);
        sec.appendChild(row);
      });

      col.appendChild(sec);
    });
  })
  .catch(err => {
    document.body.innerHTML = "<h1>資料讀取失敗</h1>";
    console.error(err);
  });
</script>

</body>
</html>
