<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全年一頁日曆｜A4</title>

<link
  rel="stylesheet"
  href="https://lib.stillnessbyslowly.com/ui/responsive.css"
>

<style>
/* =========================
   基本設定
========================= */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
  color: #111;
}

/* =========================
   控制區（不列印）
========================= */
.controls {
  padding: 12px 16px;
  border-bottom: 1px solid #ddd;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}

.controls input {
  width: 100px;
  padding: 6px 8px;
  font-size: 16px;
}

.controls button {
  padding: 6px 14px;
  font-size: 14px;
  cursor: pointer;
}

/* =========================
   A4 區域
========================= */
.page {
  width: 210mm;
  height: 297mm;
  padding: 10mm;
  margin: 0 auto;
}

/* 年份標題 */
.year-title {
  text-align: center;
  font-size: 24px;
  margin-bottom: 8mm;
}

/* 12 個月格線 */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 6mm;
  height: calc(297mm - 10mm*2 - 40px);
}

/* 單月 */
.month {
  border: 1px solid #ccc;
  padding: 4mm;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.month h3 {
  margin: 0 0 4mm;
  font-size: 16px;
  text-align: center;
}

/* 星期列 */
.week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  font-size: 11px;
  text-align: center;
  margin-bottom: 2mm;
}

.week div {
  font-weight: 600;
}

/* 日期格 */
.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: 1fr;
  font-size: 11px;
  text-align: right;
  flex: 1;
}

.day {
  padding: 1mm;
  min-height: 6mm;
  overflow: hidden;
}

.day-number {
  font-size: 10px;
  line-height: 1.1;
}

.lunar {
  margin-top: 1px;
  font-size: 7.5px;
  line-height: 1.15;
  color: #666;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.solar-term {
  margin-top: 1px;
  font-size: 7.5px;
  line-height: 1.15;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* =========================
   螢幕自適應
========================= */
@media screen and (max-width: 900px) {
  .page {
    width: 100%;
    height: auto;
    padding: 20px;
  }

  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: none;
    height: auto;
    gap: 16px;
  }

  .month {
    min-height: 300px;
  }

  .day {
    min-height: 34px;
  }

  .day-number {
    font-size: 12px;
  }

  .lunar,
  .solar-term {
    font-size: 9px;
  }
}

@media screen and (max-width: 600px) {
  .page {
    padding: 16px 12px;
  }

  .year-title {
    margin-bottom: 20px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .month {
    min-height: 340px;
  }

  .day {
    min-height: 40px;
  }

  .day-number {
    font-size: 14px;
  }

  .lunar,
  .solar-term {
    font-size: 10px;
  }
}

/* =========================
   列印設定
========================= */
@media print {
  .controls {
    display: none;
  }

  body {
    margin: 0;
  }
}
</style>
</head>

<body>

<div class="controls">
  <label>
    年份
    <input
      id="yearInput"
      type="number"
      min="1901"
      max="2100"
      value="2026"
    >
  </label>

  <button type="button" onclick="render()">產生</button>
  <button type="button" onclick="window.print()">列印</button>
</div>

<div class="page">
  <div class="year-title" id="yearTitle"></div>
  <div class="grid" id="calendarGrid"></div>
</div>

<script src="https://lib.stillnessbyslowly.com/calendar/lunar_data.js"></script>
<script src="https://lib.stillnessbyslowly.com/calendar/lunar.js"></script>
<script src="https://lib.stillnessbyslowly.com/calendar/solar_terms_data.js"></script>
<script src="https://lib.stillnessbyslowly.com/calendar/solar_terms.js"></script>
<script src="https://lib.stillnessbyslowly.com/calendar/calendar.js"></script>

<script>
const weekNames = ["日", "一", "二", "三", "四", "五", "六"];

function lunarLabel(lunar) {
  if (!lunar) return "";

  /*
   * 農曆初一顯示月份名稱，
   * 其他日期顯示初二、初三、十五等。
   */
  if (lunar.day === 1) {
    return lunar.monthName ||
      ((lunar.isLeap ? "閏" : "") + lunar.month + "月");
  }

  return lunar.dayName || String(lunar.day);
}

function solarTermLabel(solarTerm) {
  if (!solarTerm) return "";

  /*
   * Calendar 原則上可能保留多筆節氣，
   * 因此 UI 同時接受單筆與陣列。
   */
  if (Array.isArray(solarTerm)) {
    return solarTerm
      .map(item => item.name || "")
      .filter(Boolean)
      .join("、");
  }

  return solarTerm.name || "";
}

function render() {
  const year = parseInt(
    document.getElementById("yearInput").value,
    10
  );

  if (!Number.isInteger(year)) return;

  if (!Calendar.isSupportedYear(year)) {
    alert("目前僅支援 1901–2100 年。");
    return;
  }

  /*
   * 年、月、日期、星期、農曆、節氣
   * 全部由 Calendar 統一提供。
   *
   * 本頁只負責顯示。
   */
  const yearData = Calendar.getYear(year);

  document.getElementById("yearTitle").textContent =
    yearData.year + " 年";

  const grid = document.getElementById("calendarGrid");
  grid.innerHTML = "";

  yearData.months.forEach(monthData => {
    const monthBox = document.createElement("div");
    monthBox.className = "month";

    /* 月份標題 */
    const title = document.createElement("h3");
    title.textContent = monthData.month + " 月";
    monthBox.appendChild(title);

    /* 星期列 */
    const weekRow = document.createElement("div");
    weekRow.className = "week";

    weekNames.forEach(name => {
      const item = document.createElement("div");
      item.textContent = name;
      weekRow.appendChild(item);
    });

    monthBox.appendChild(weekRow);

    /* 日期區 */
    const daysBox = document.createElement("div");
    daysBox.className = "days";

    /*
     * 月初空格直接使用 Calendar 提供的 firstWeekday。
     */
    for (let i = 0; i < monthData.firstWeekday; i++) {
      daysBox.appendChild(document.createElement("div"));
    }

    /*
     * 每一天已經包含：
     *
     * dayData.day
     * dayData.weekday
     * dayData.lunar
     * dayData.solarTerm
     */
    monthData.days.forEach(dayData => {
      const day = document.createElement("div");
      day.className = "day";

      const number = document.createElement("div");
      number.className = "day-number";
      number.textContent = dayData.day;
      day.appendChild(number);

      if (dayData.lunar) {
        const lunar = document.createElement("div");
        lunar.className = "lunar";
        lunar.textContent = lunarLabel(dayData.lunar);
        day.appendChild(lunar);
      }

      if (dayData.solarTerm) {
        const solarTerm = document.createElement("div");
        solarTerm.className = "solar-term";
        solarTerm.textContent =
          solarTermLabel(dayData.solarTerm);
        day.appendChild(solarTerm);
      }

      daysBox.appendChild(day);
    });

    monthBox.appendChild(daysBox);
    grid.appendChild(monthBox);
  });
}

render();
</script>

</body>
</html>
