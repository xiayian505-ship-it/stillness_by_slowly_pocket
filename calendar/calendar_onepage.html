<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>全年一頁日曆｜A4</title>

<style>
/* =========================
   基本設定
========================= */
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
  color: #111;
}

/* =========================
   控制區（不列印）
========================= */
.controls {
  padding: 12px 16px;
  border-bottom: 1px solid #ddd;
  display: flex;
  gap: 12px;
  align-items: center;
}

.controls input {
  width: 100px;
  padding: 6px 8px;
  font-size: 16px;
}

.controls button {
  padding: 6px 14px;
  font-size: 14px;
  cursor: pointer;
}

/* =========================
   A4 區域
========================= */
.page {
  width: 210mm;
  height: 297mm;
  padding: 10mm;
  margin: 0 auto;
}

/* 年份標題 */
.year-title {
  text-align: center;
  font-size: 24px;
  margin-bottom: 8mm;
}

/* 12 個月格線 */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 6mm;
  height: calc(297mm - 10mm*2 - 40px);
}

/* 單月 */
.month {
  border: 1px solid #ccc;
  padding: 4mm;
  display: flex;
  flex-direction: column;
}

.month h3 {
  margin: 0 0 4mm;
  font-size: 16px;
  text-align: center;
}

/* 星期列 */
.week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  font-size: 11px;
  text-align: center;
  margin-bottom: 2mm;
}

.week div {
  font-weight: 600;
}

/* 日期格 */
.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: 1fr;
  font-size: 11px;
  text-align: right;
}

.day {
  padding: 1mm;
  min-height: 6mm;
}

/* =========================
   列印設定
========================= */
@media print {
  .controls { display: none; }
  body { margin: 0; }
}
</style>
</head>

<body>

<div class="controls">
  <label>年份
    <input id="yearInput" type="number" value="2026">
  </label>
  <button onclick="render()">產生</button>
  <button onclick="window.print()">列印</button>
</div>

<div class="page">
  <div class="year-title" id="yearTitle"></div>
  <div class="grid" id="calendarGrid"></div>
</div>

<script>
const weekNames = ["日","一","二","三","四","五","六"];

function render() {
  const year = parseInt(document.getElementById("yearInput").value, 10);
  if (!year) return;

  document.getElementById("yearTitle").textContent = year + " 年";
  const grid = document.getElementById("calendarGrid");
  grid.innerHTML = "";

  for (let m = 0; m < 12; m++) {
    const monthBox = document.createElement("div");
    monthBox.className = "month";

    const title = document.createElement("h3");
    title.textContent = (m + 1) + " 月";
    monthBox.appendChild(title);

    const weekRow = document.createElement("div");
    weekRow.className = "week";
    weekNames.forEach(w => {
      const d = document.createElement("div");
      d.textContent = w;
      weekRow.appendChild(d);
    });
    monthBox.appendChild(weekRow);

    const daysBox = document.createElement("div");
    daysBox.className = "days";

    const firstDay = new Date(year, m, 1).getDay();
    const daysInMonth = new Date(year, m + 1, 0).getDate();

    // 空白
    for (let i = 0; i < firstDay; i++) {
      daysBox.appendChild(document.createElement("div"));
    }

    // 日期
    for (let d = 1; d <= daysInMonth; d++) {
      const day = document.createElement("div");
      day.className = "day";
      day.textContent = d;
      daysBox.appendChild(day);
    }

    monthBox.appendChild(daysBox);
    grid.appendChild(monthBox);
  }
}

render();
</script>

</body>
</html>
